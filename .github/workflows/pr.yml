name: pr

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - name: changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files"
          --paginate -q '.[].filename' > changed.txt
      - name: validate
        run: python3 validate_pr.py pr changed.txt "${{ github.event.pull_request.user.login }}"
      - name: report failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f validation_errors.txt ] || exit 0
          {
            echo "validation failed:"
            echo '```'
            cat validation_errors.txt
            echo '```'
            echo "fix and push to this branch, the check reruns on its own."
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file comment.md
      - name: script owner
        id: owner
        run: echo "login=$(cat foreign_owner.txt 2>/dev/null)" >> "$GITHUB_OUTPUT"
      - name: ask the owner
        if: ${{ !github.event.pull_request.draft && steps.owner.outputs.login != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ steps.owner.outputs.login }}
        run: >
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }}
          --body "@$OWNER this PR edits your script. Comment \`/approve\` if you're ok with it and it merges on its own."
      - name: automerge
        if: ${{ !github.event.pull_request.draft && steps.owner.outputs.login == '' }}
        uses: ./.github/actions/merge
        with:
          number: ${{ github.event.pull_request.number }}
          base: ${{ github.event.pull_request.base.ref }}
          token: ${{ github.token }}
