[script]
name = "Arknights"
description = "Downloads and installs the Arknights launcher. Pick your region: Global (Yostar) or CN (Hypergryph)"
author = "reakjra"
icon = "./icon.png"
note = "Usable in version 0.12.0 or newer.\nLet the launcher open when the installer finishes, then close it so the script can continue. Closing the installer early can leave the install folder unrecorded."

[[input]]
id = "prefix"
kind = "prefix"
picker = "path"
label = "Wine prefix"

[[input]]
id = "runner"
kind = "runner"
label = "Runner (any Proton works~)"

[[input]]
id = "region"
kind = "choice"
label = "Region"
options = ["Global", "CN"]

[[step]]
task = "init_prefix"

[[step]]
task = "download"
url = "https://launcher-pkg-ark-en.yo-star.com/install_pkg/game_launcher/Arknights_EN/Arknights_EN_Gamelauncher-1.8.1-setup.exe"
dest = "${cache}/Arknights_EN_Gamelauncher-1.8.1-setup.exe"
when = { region = "Global" }

[[step]]
task = "run_exe"
exe = "${cache}/Arknights_EN_Gamelauncher-1.8.1-setup.exe"
when = { region = "Global" }

[[step]]
task = "download"
url = "https://launcher.hypergryph.com/launcher/get_latest_launcher?appcode=abYeZZ16BPluCFyT&channel=1"
dest = "${cache}/HypergryphLauncher_v1.5.0.1511_1_1_official.exe"
when = { region = "CN" }

[[step]]
task = "run_exe"
exe = "${cache}/HypergryphLauncher_v1.5.0.1511_1_1_official.exe"
when = { region = "CN" }

[[game]]
name = "Arknights (Global)"
exe_from_registry = "2e58e99e-289b-5a3a-bbb9-4ac4e8299900"
when = { region = "Global" }

[[game]]
name = "Arknights (CN)"
exe_from_registry = "33a0a6296a20400d503c59ac0fd6341e"
when = { region = "CN" }
