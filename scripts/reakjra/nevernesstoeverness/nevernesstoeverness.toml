[script]
name = "Neverness To Everness"
description = "Downloads the official Neverness To Everness launcher installer and runs it in a prefix of your choice"
author = "reakjra"
icon = "./icon.png"
note = "Usable in version 0.12.0 or newer.\nLet the launcher open when the installer finishes, then close it so the script can continue. Closing the installer early can leave the install folder unrecorded."

[[input]]
id = "prefix"
kind = "prefix"
picker = "path"
label = "Wine prefix"

[[input]]
id = "runner"
kind = "runner"
label = "Runner (any Proton works~)"

[[input]]
id = "region"
kind = "choice"
label = "Region"
options = ["Global", "CN"]

[[step]]
task = "init_prefix"

[[step]]
task = "download"
url_from = "https://www.perfectworld.com/public/commonData/gamesData/gameDownload/nte-gameDownload.js"
url_match = 'https://ntecdn\d*\.perfectworld\.com/[^"]+\.exe'
dest = "${cache}/nte-setup.exe"
when = { region = "Global" }

[[step]]
task = "download"
url_from = "https://static.games.wanmei.com/public/commonData/gamesData/gameDownload/yh-gameDownload.js"
url_match = 'https://yhcdn\d*\.wmupd\.com/[^"]+\.exe'
dest = "${cache}/nte-setup.exe"
when = { region = "CN" }

[[step]]
task = "run_exe"
exe = "${cache}/nte-setup.exe"

[[game]]
name = "Neverness To Everness"
exe_from_registry = "NTEGlobal"
when = { region = "Global" }

[[game]]
name = "Neverness To Everness (CN)"
exe_from_registry = "YH"
when = { region = "CN" }
