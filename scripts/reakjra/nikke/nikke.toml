[script]
name = "NIKKE"
description = "Downloads the NikkeLinux miniloader and runs it to install NIKKE"
author = "reakjra"
icon = "./icon.png"
note = "Usable in version 0.12.0 or newer.\nLet the launcher open when the installer finishes, then close it so the script can continue. Closing the installer early can leave the install folder unrecorded."

[[input]]
id = "prefix"
kind = "prefix"
picker = "path"
label = "Wine prefix"

[[step]]
task = "init_prefix"

[[step]]
task = "download"
url = "https://raw.githubusercontent.com/KoleckOLP/NikkeLinux/master/NikkeMiniloader0.0.6.143.exe"
dest = "${cache}/NikkeMiniloader.exe"

[[step]]
task = "run_exe"
exe = "${cache}/NikkeMiniloader.exe"

[game]
name = "NIKKE"
wine_version = "system"
exe_from_registry = "nikke_launcher"
