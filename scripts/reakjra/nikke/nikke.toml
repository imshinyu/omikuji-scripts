[script]
name = "NIKKE"
description = "Downloads the official NIKKE miniloader and runs it in a prefix of your choice"
author = "reakjra"
icon = "./icon.png"
note = "Usable in version 0.12.0 or newer.\nLet the launcher open when the installer finishes, then close it so the script can continue. Closing the installer early can leave the install folder unrecorded."

[[input]]
id = "prefix"
kind = "prefix"
picker = "path"
label = "Wine prefix"

[[input]]
id = "runner"
kind = "runner"
label = "Runner (Proton recommended~)"

[[step]]
task = "init_prefix"

[[step]]
task = "download"
url = "https://nikke-en.com/nikkeminiloader.exe"
dest = "${cache}/NikkeMiniloader.exe"

[[step]]
task = "run_exe"
exe = "${cache}/NikkeMiniloader.exe"

[game]
name = "NIKKE"
exe_from_registry = "nikke_launcher"
