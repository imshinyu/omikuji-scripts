[script]
name = "Rockstar Games Launcher"
description = "Downloads the official Rockstar Games Launcher installer and runs it in a prefix of your choice"
author = "reakjra"
icon = "./icon.png"
note = "The installer only accepts a path ending in a folder that does not exist yet, so add one like \\Rockstar to whatever you pick.\nLet the launcher open when the installer finishes, then close it so the script can continue. Closing the installer early can leave the install folder unrecorded."

[[input]]
id = "prefix"
kind = "prefix"
picker = "path"
label = "Wine prefix"

[[input]]
id = "runner"
kind = "runner"
label = "Runner (Proton recommended~)"

[[step]]
task = "init_prefix"

[[step]]
task = "download"
url = "https://gamedownloads.rockstargames.com/public/installer/Rockstar-Games-Launcher.exe"
dest = "${cache}/Rockstar-Games-Launcher.exe"

[[step]]
task = "run_exe"
exe = "${cache}/Rockstar-Games-Launcher.exe"

[game]
name = "Rockstar Games Launcher"
exe_from_registry = "Rockstar Games Launcher"
