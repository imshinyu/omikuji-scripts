[script]
name = "Ubisoft Connect"
description = "Downloads the Ubisoft Connect installer and runs it in a prefix of your choice"
author = "reakjra"
icon = "./icon.png"
note = "Usable in version 0.12.0 or newer.\nLet the launcher open when the installer finishes, then close it so the script can continue. Closing the installer early can leave the install folder unrecorded."

[[input]]
id = "prefix"
kind = "prefix"
picker = "path"
label = "Wine prefix"

[[input]]
id = "runner"
kind = "runner"
label = "Runner (any Proton works~)"

[[step]]
task = "init_prefix"

[[step]]
task = "download"
url = "https://static3.cdn.ubi.com/orbit/launcher_installer/UbisoftConnectInstaller.exe"
dest = "${cache}/UbisoftConnectInstaller.exe"

[[step]]
task = "run_exe"
exe = "${cache}/UbisoftConnectInstaller.exe"

[game]
name = "Ubisoft Connect"
exe_from_registry = "Uplay"
