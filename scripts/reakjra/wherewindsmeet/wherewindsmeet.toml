[script]
name = "Where Winds Meet"
description = "Downloads and installs the Where Winds Meet launcher. Pick Globalor CN"
author = "reakjra"
icon = "./icon.png"
note = "Let the launcher open when the installer finishes, then close it so the script can continue. Closing the installer early can leave the install folder unrecorded."

[[input]]
id = "prefix"
kind = "prefix"
picker = "path"
label = "Wine prefix"

[[input]]
id = "runner"
kind = "runner"
label = "Runner (any Proton works~)"

[[input]]
id = "region"
kind = "choice"
label = "Region"
options = ["Global", "CN"]

[[step]]
task = "init_prefix"

[[step]]
task = "download"
url = "https://h72naxx2gb.gdl.easebar.com/wwm_1.0.0_neteaseglobal_setup.exe"
dest = "${cache}/wwm_1.0.0_neteaseglobal_setup.exe"
when = { region = "Global" }

[[step]]
task = "run_exe"
exe = "${cache}/wwm_1.0.0_neteaseglobal_setup.exe"
when = { region = "Global" }

[[step]]
task = "download"
url_from = "https://adl.netease.com/d/g/yysls/c/gw?type=pc"
url_match = 'https://[^"]*gdl\.netease\.com/[^"]+\.exe\?[^"]+'
dest = "${cache}/yysls-setup.exe"
when = { region = "CN" }

[[step]]
task = "run_exe"
exe = "${cache}/yysls-setup.exe"
when = { region = "CN" }

[[game]]
name = "Where Winds Meet (Global)"
exe_from_registry = "wwm_launcher_uninstall"
when = { region = "Global" }

[[game]]
name = "Where Winds Meet (CN)"
exe_from_registry = "yysls_launcher_uninstall"
when = { region = "CN" }
